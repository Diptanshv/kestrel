# Netlify deploy for the dashboard (base directory: web).
#
# The API lives on a container host, but the browser must see one origin:
# the session cookie is SameSite=Lax and the dashboard reads the CSRF cookie
# from document.cookie, neither of which works cross-site. So Netlify proxies
# /api/* and /script.js to the API (status 200 = rewrite, not redirect).
#
# Replace kestrel-api.onrender.com with your API host. With this proxy in
# front of Render, the API sees two proxy hops: set TRUSTED_PROXY_HOPS=2.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://kestrel-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/script.js"
  to = "https://kestrel-api.onrender.com/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
